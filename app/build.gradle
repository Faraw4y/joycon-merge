plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joyconmerge'
    compileSdk 34

    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.joyconmerge"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "3.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

/*
 * Copy binary uinput_setup ke assets setelah NDK selesai kompilasi.
 *
 * Nama task CMake di AGP modern adalah:
 *   configureCMake<Variant>[<ABI>]
 *   buildCMake<Variant>[<ABI>]    <- tapi ini tidak selalu reliable
 *
 * Cara paling reliable: pakai preBuild sebagai trigger,
 * lalu cek file output CMake yang sudah ada.
 * Tapi yang paling simple dan proven: gunakan Task rule dari AGP
 * dengan nama eksak yang dihasilkan.
 *
 * SOLUSI TERBAIK: Jalankan copy di afterEvaluate dengan
 * dependsOn ke externalNativeBuild task yang benar.
 */
afterEvaluate {
    // Task copy untuk setiap ABI dan variant
    android.applicationVariants.all { variant ->
        def variantName = variant.name.capitalize()  // "Release" atau "Debug"

        ['arm64-v8a', 'armeabi-v7a'].each { abi ->
            def abiTag = abi.replace('-', '_').replace('/', '_')

            // Path output CMake: build/intermediates/cmake/<variant>/obj/<abi>/uinput_setup
            def srcFile = file("${layout.buildDirectory.get().asFile}/intermediates/cmake/${variant.name}/obj/${abi}/uinput_setup")
            def dstDir  = file("src/main/assets")
            def dstFile = file("${dstDir}/uinput_setup_${abi}")

            def copyTask = tasks.register("copyUinputSetup_${abiTag}_${variantName}") {
                // Tidak pakai dependsOn nama task — langsung pastikan assets dir ada
                // Copy dilakukan manual di doLast setelah build selesai
                doLast {
                    if (srcFile.exists()) {
                        dstDir.mkdirs()
                        dstFile.bytes = srcFile.bytes
                        println "Copied uinput_setup (${abi}) -> ${dstFile}"
                    } else {
                        throw new GradleException(
                            "uinput_setup binary not found at: ${srcFile}\n" +
                            "CMake build may not have run yet.")
                    }
                }
            }

            // Jalankan copy SETELAH externalNativeBuild selesai,
            // SEBELUM mergeAssets mengemas APK
            def externalBuildTask = tasks.findByName("externalNativeBuild${variantName}")
            if (externalBuildTask) {
                copyTask.configure { dependsOn externalBuildTask }
            }

            tasks.named("merge${variantName}Assets").configure {
                dependsOn copyTask
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
