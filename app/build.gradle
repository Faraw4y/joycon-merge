plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joyconmerge'
    compileSdk 34

    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.joyconmerge"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "13.0-shizuku"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        viewBinding true
        // Diperlukan agar AIDL ter-generate
        aidlPackagedList = []
    }

    // Aktifkan AIDL processing
    buildFeatures {
        aidl true
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

/*
 * Copy uinput_setup binary ke assets setelah NDK build.
 * Binary di-bundle sebagai "uinput_setup_<abi>" di APK assets.
 */
afterEvaluate {
    android.applicationVariants.all { variant ->
        def variantName = variant.name.capitalize()

        ['arm64-v8a', 'armeabi-v7a'].each { abi ->
            def abiTag   = abi.replace('-', '_').replace('/', '_')
            def srcFile  = file("${layout.buildDirectory.get().asFile}/intermediates/cmake/${variant.name}/obj/${abi}/uinput_setup")
            def dstDir   = file("src/main/assets")
            def dstFile  = file("${dstDir}/uinput_setup_${abi}")

            def copyTask = tasks.register("copyUinputSetup_${abiTag}_${variantName}") {
                doLast {
                    if (srcFile.exists()) {
                        dstDir.mkdirs()
                        dstFile.bytes = srcFile.bytes
                        println "Copied uinput_setup (${abi}) -> ${dstFile}"
                    } else {
                        throw new GradleException(
                            "uinput_setup binary not found: ${srcFile}\n" +
                            "Pastikan NDK build sudah berjalan terlebih dulu.")
                    }
                }
            }

            def externalBuildTask = tasks.findByName("externalNativeBuild${variantName}")
            if (externalBuildTask) {
                copyTask.configure { dependsOn externalBuildTask }
            }
            tasks.named("merge${variantName}Assets").configure {
                dependsOn copyTask
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ── Shizuku ─────────────────────────────────────────────────────────────
    // API: digunakan oleh app untuk request permission dan bind UserService
    implementation 'dev.rikka.shizuku:api:13.1.5'
    // Provider: digunakan untuk menerima Binder dari Shizuku
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
